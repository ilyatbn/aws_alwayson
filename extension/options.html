<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS AlwaysON - Settings</title>
    <script src="/js/tailwind.min.js"></script>
    <script src="/js/jquery.min.js"></script>
    <style>
        #tooltip-container {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            display: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }
        
        #tooltip-container .tooltip-content {
            background-color: #1f2937;
            color: white;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 300px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            line-height: 1.4;
        }
        
        .help-button {
            cursor: help;
        }
        
        .help-button:hover {
            color: #6b7280 !important;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <div class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img src="/img/icon128.png" alt="AWS AlwaysON" class="w-8 h-8 rounded-lg">
                    <h1 class="text-xl font-semibold text-gray-900">AWS AlwaysON</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="bg-white border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4">
            <nav class="flex space-x-8" id="tab-navigation">
                <!-- Tabs will be dynamically generated here -->
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Content sections will be dynamically generated here -->
        <div id="content-sections"></div>
    </div>

    <!-- Tooltip Container -->
    <div id="tooltip-container">
        <div class="tooltip-content" id="tooltip-content"></div>
    </div>

    <!-- Success/Error Toast -->
    <div id="toast" class="fixed top-4 right-4 z-50 transform transition-all duration-300 translate-x-full">
        <div class="bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
            </svg>
            <span id="toast-message">Settings saved successfully!</span>
        </div>
    </div>

    <!-- Scripts - Load in correct order -->
    <script src="menu-config.js"></script>
    <script src="options.js"></script>
</body>
</html>
